name: Build and Test

on:
  push:
    branches: [main, dev, 'feature/**', 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Build / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install declared packages
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://packagefeedproxy.microsoft.io/npm/
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Unit and UI tests
        run: npm test
      - name: Build the static package
        run: npm run build
      - name: Save results and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_id }}
          path: |
            artifacts/
            reports/
            playwright-report/
            test-results/
          retention-days: 90
