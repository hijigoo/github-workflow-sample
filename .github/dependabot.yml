version: 2
registries:
  package-proxy:
    type: npm-registry
    url: https://packagefeedproxy.microsoft.io/npm/
    replaces-base: true
  existing-mirror:
    type: npm-registry
    url: https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/
updates:
  - package-ecosystem: npm
    directory: /
    registries: [package-proxy, existing-mirror]
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: [dependencies, sample]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    labels: [dependencies, sample]
